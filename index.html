<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>~/portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />

  <style>
    /* ============================================================
       TOKENS · "dossier de terminal": tinta profunda, ámbar CRT
       como color de marca, y colores de dificultad reservados
       SOLO para los badges (el resto de la página se mantiene sobrio).
       ============================================================ */
    :root {
      --bg:        #0b0e13;
      --surface:   #12171f;
      --surface-2: #171d27;
      --border:    #232c38;
      --text:      #c9d1dc;
      --muted:     #6b7684;
      --accent:    #f2b705;   /* ámbar CRT = marca */
      --accent-dim:#7a5f10;

      /* Dificultad (convención tipo HTB) */
      --easy:   #56d364;
      --medium: #f2b705;
      --hard:   #e5484d;
      --insane: #c264e5;

      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    .layout { display: flex; min-height: 100vh; }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
    .brand .prompt { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .brand .prompt .sigil { color: var(--accent); }
    .brand .cursor {
      display: inline-block; width: 8px; height: 1.05em; background: var(--accent);
      margin-left: 2px; vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .brand .tagline { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    /* Selector de idioma */
    .brand-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .lang-switch { display: flex; border: 1px solid var(--border); flex-shrink: 0; }
    .lang-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 3px 8px; background: transparent; border: none; color: var(--muted); cursor: pointer; }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active { background: var(--surface-2); color: var(--accent); }
    .lang-btn + .lang-btn { border-left: 1px solid var(--border); }
    /* Aviso cuando un writeup aún no está traducido */
    .doc-banner { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px dashed var(--accent-dim); padding: 8px 12px; margin-bottom: 24px; }

    nav { padding: 8px 0 40px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-family: var(--mono); font-size: 13.5px;
      color: var(--text); border-left: 2px solid transparent;
    }
    .nav-link:hover { background: var(--surface-2); text-decoration: none; }
    .nav-link.active { background: var(--surface-2); border-left-color: var(--accent); color: var(--accent); }
    .nav-link .glyph { color: var(--accent-dim); }
    .nav-link.active .glyph { color: var(--accent); }

    .section-title {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
      padding: 20px 20px 8px; display: flex; align-items: center; gap: 8px;
    }
    .section-title::before { content: ""; width: 6px; height: 6px; background: var(--accent-dim); transform: rotate(45deg); }
    .entry { display: block; padding: 8px 20px 8px 34px; font-size: 13.5px; color: var(--text); border-left: 2px solid transparent; }
    .entry:hover { background: var(--surface-2); text-decoration: none; }
    .entry.active { background: var(--surface-2); border-left-color: var(--accent); color: var(--accent); }
    .entry .entry-meta { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

    /* ---------- CONTENIDO ---------- */
    .content { flex: 1; min-width: 0; padding: 56px clamp(24px, 6vw, 88px) 120px; max-width: 960px; margin: 0 auto; width: 100%; }

    /* ===== PORTADA / PERFIL ===== */
    .hero .role {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--accent);
    }
    .hero h1 {
      font-family: var(--mono); font-size: clamp(34px, 6vw, 58px); line-height: 1.02;
      letter-spacing: -0.03em; margin: 10px 0 12px;
    }
    .hero .handle-line { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0 0 20px; }
    .hero .handle-line .at { color: var(--accent-dim); }
    .hero .handle-line .dot { margin: 0 8px; color: var(--accent-dim); }
    .hero .pitch { font-size: 18px; color: var(--muted); max-width: 62ch; }
    .hero .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .hero .links a {
      font-family: var(--mono); font-size: 13px; padding: 7px 14px;
      border: 1px solid var(--border); color: var(--text);
    }
    .hero .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    /* Certificaciones: destacadas con borde ámbar */
    .certs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }
    .certs .clabel { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-right: 4px; }
    .cert { font-family: var(--mono); font-size: 12px; padding: 4px 11px; border: 1px solid var(--accent-dim); color: var(--accent); background: var(--surface); }
    .cert .issuer { color: var(--muted); }

    .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .skill {
      font-family: var(--mono); font-size: 12px; padding: 4px 11px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    }

    /* Estadísticas principales (se calculan solas desde los datos) */
    .statbar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1px; margin-top: 44px; background: var(--border);
      border: 1px solid var(--border);
    }
    .statbar .cell { background: var(--bg); padding: 18px 20px; }
    .statbar .n { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; }
    .statbar .l { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-top: 8px; text-transform: uppercase; }

    /* Desglose por dificultad (fila secundaria, con puntos de color) */
    .diffbar { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 18px; font-family: var(--mono); font-size: 13px; }
    .diffbar .d { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
    .diffbar .d::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
    .diffbar .d.easy { --dot: var(--easy); } .diffbar .d.medium { --dot: var(--medium); }
    .diffbar .d.hard { --dot: var(--hard); } .diffbar .d.insane { --dot: var(--insane); }
    .diffbar .d b { color: var(--text); font-weight: 700; }

    /* ===== CATÁLOGO DE MÁQUINAS ===== */
    .view-head { margin-bottom: 28px; }
    .view-head .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    .view-head h2 { font-family: var(--mono); font-size: 30px; letter-spacing: -0.02em; margin: 8px 0 0; }

    /* Filtros agrupados por criterio */
    .filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
    .filter-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .filter-label {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--muted);
      width: 92px; flex-shrink: 0; text-align: right;
    }
    .chip-set { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: var(--mono); font-size: 12px; padding: 6px 12px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    }
    .chip:hover { color: var(--text); }
    .chip.active { border-color: var(--accent); color: var(--accent); background: var(--surface-2); }
    /* Punto de color por dificultad (solo el punto, el texto no cambia) */
    .chip-diff { display: inline-flex; align-items: center; gap: 7px; }
    .chip-diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex-shrink: 0; }
    .chip-diff.easy   { --dot: var(--easy); }
    .chip-diff.medium { --dot: var(--medium); }
    .chip-diff.hard   { --dot: var(--hard); }
    .chip-diff.insane { --dot: var(--insane); }
    /* Botón de limpiar (aparece solo con filtros activos) */
    .chip-reset { align-self: flex-start; border-style: dashed; }
    .chip-reset:hover { color: var(--hard); border-color: var(--hard); }

    @media (max-width: 860px) {
      .filter-label { width: auto; text-align: left; }
    }

    /* Tabla (desktop) */
    .machines-table { width: 100%; border-collapse: collapse; }
    .machines-table th {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .machines-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }
    .machines-table tr.row { cursor: pointer; }
    .machines-table tr.row:hover td { background: var(--surface); }
    .machines-table .m-name { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .machines-table tr.row:hover .m-name { color: var(--accent); }
    .machines-table .m-tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }

    .badge { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); white-space: nowrap; display: inline-block; }
    .badge.plat { color: var(--muted); }
    .badge.os { color: var(--muted); }
    .diff { font-family: var(--mono); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
    .diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .diff.easy { color: var(--easy); } .diff.medium { color: var(--medium); }
    .diff.hard { color: var(--hard); } .diff.insane { color: var(--insane); }
    .minitag { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }

    .empty { font-family: var(--mono); color: var(--muted); padding: 40px 0; text-align: center; }

    /* ===== WRITEUP RENDERIZADO ===== */
    .doc-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .doc-header .crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    .doc-header .crumb .sep { color: var(--accent-dim); margin: 0 6px; }
    .doc-header h1 { font-family: var(--mono); font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; margin: 14px 0 0; }
    .doc-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }

    .markdown { font-size: 16px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { font-family: var(--mono); letter-spacing: -0.02em; line-height: 1.25; margin: 2em 0 0.6em; }
    .markdown h1 { font-size: 26px; } .markdown h2 { font-size: 21px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .markdown h3 { font-size: 18px; color: var(--accent); }
    .markdown p { margin: 1em 0; }
    .markdown ul, .markdown ol { padding-left: 1.4em; } .markdown li { margin: 0.35em 0; }
    .markdown img { max-width: 100%; border: 1px solid var(--border); }
    .markdown blockquote { margin: 1.4em 0; padding: 4px 18px; border-left: 3px solid var(--accent); background: var(--surface); color: var(--muted); }
    .markdown hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }
    .markdown code { font-family: var(--mono); font-size: 0.88em; background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; color: var(--accent); }
    .markdown pre { background: var(--surface) !important; border: 1px solid var(--border); border-radius: 6px; padding: 0; overflow: hidden; margin: 1.5em 0; }
    .markdown pre code { display: block; background: transparent !important; border: none; padding: 18px 20px; overflow-x: auto; color: var(--text); font-size: 13.5px; line-height: 1.6; border-radius: 0; }
    .markdown table { border-collapse: collapse; width: 100%; margin: 1.5em 0; font-size: 14px; }
    .markdown th, .markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .markdown th { background: var(--surface); font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

    .status { font-family: var(--mono); color: var(--muted); font-size: 14px; }
    .status.error { color: var(--hard); }

    /* ---------- RESPONSIVE ---------- */
    .menu-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 30; background: var(--surface); border: 1px solid var(--border); color: var(--accent); font-family: var(--mono); font-size: 13px; padding: 8px 12px; cursor: pointer; }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 15; }

    @media (max-width: 860px) {
      .menu-btn { display: block; }
      .sidebar { position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.22s ease; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
      .sidebar.open { transform: translateX(0); }
      .backdrop.show { display: block; }
      .content { padding-top: 68px; }

      /* La tabla de máquinas pasa a tarjetas */
      .machines-table, .machines-table tbody, .machines-table tr, .machines-table td { display: block; width: 100%; }
      .machines-table thead { display: none; }
      .machines-table tr.row { border: 1px solid var(--border); margin-bottom: 12px; padding: 4px 0; }
      .machines-table tr.row:hover td { background: transparent; }
      .machines-table td { border: none; padding: 6px 16px; }
      .machines-table td::before { content: attr(data-label); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 3px; }
      .machines-table td.td-name::before { display: none; }
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir el menú">☰ menu</button>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-top">
          <div class="prompt"><span class="sigil">~/</span><span id="brandHandle">portfolio</span><span class="cursor"></span></div>
          <div class="lang-switch" id="langSwitch">
            <button class="lang-btn" data-lang="eu">EU</button>
            <button class="lang-btn" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
        <div class="tagline" id="tagline">cargando…</div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <main class="content" id="content">
      <p class="status">Inicializando…</p>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
  /* ================================================================
     PORTFOLIO OFENSIVO
     Datos en portfolio.json:
       · profile   -> portada / segundo CV
       · machines  -> catálogo con nombre, plataforma, dificultad, SO
       · sections  -> otras cosas (proyectos, notas...) como docs .md
     Rutas por hash:
       #/            -> portada
       #/machines    -> catálogo filtrable
       #<archivo.md> -> writeup o doc renderizado
     ================================================================ */

    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const tagline = document.getElementById('tagline');
    const brandHandle = document.getElementById('brandHandle');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');

    const langSwitch = document.getElementById('langSwitch');

    let data = null;
    const byFile = new Map();          // ruta -> { entry, kind, section? }

    // filtros activos del catálogo
    const filters = { platform: null, difficulty: null };

    /* ================================================================
       IDIOMA (i18n) — EU / ES / EN
       · t(clave)   -> texto de interfaz en el idioma activo
       · tr(valor)  -> resuelve un campo de datos que puede ser un string
                       (igual en todos los idiomas) o un objeto {eu,es,en}
       · trArr(v)   -> igual pero para arrays ({eu:[...],es:[...],en:[...]})
       · resolveDoc -> elige el .md del idioma activo (via file_i18n)
       Para añadir un idioma nuevo: agrega su bloque a I18N, su botón en
       el HTML del selector, y su versión a los campos {eu,es,en} del JSON.
       ================================================================ */
    const LANGS = ['eu', 'es', 'en'];
    const DEFAULT_LANG = 'es';   // idioma base de los .md sin traducir
    let lang = 'es';

    const I18N = {
      eu: {
        profile: 'profila', machines: 'makinak', machinesTitle: 'Makinak',
        projects: 'Proiektuak', certifications: 'Ziurtagiriak', catalog: 'katalogoa',
        platform: 'Plataforma', difficulty: 'Zailtasuna', os: 'SE', date: 'Data',
        machineCol: 'Makina', clean: '✕ Iragazkiak garbitu',
        byDifficulty: 'Makinak zailtasunaren arabera:',
        empty: 'Ez dago makinarik iragazki honetarako.',
        initializing: 'Hasieratzen…', menu: '☰ menua',
        reading: f => `${f} irakurtzen…`,
        loadErr: f => `Ezin izan da «${f}» kargatu`,
        jsonErr: 'Ezin izan da portfolio.json kargatu',
        servedNote: 'fetch()-ek karpeta zerbitzatzean bakarrik funtzionatzen du (GitHub Pages edo tokiko zerbitzaria).',
        notTranslated: dl => `Eduki hau ez dago oraindik itzulita; ${dl} erakusten da.`
      },
      es: {
        profile: 'perfil', machines: 'máquinas', machinesTitle: 'Máquinas',
        projects: 'Proyectos', certifications: 'Certificaciones', catalog: 'catálogo',
        platform: 'Plataforma', difficulty: 'Dificultad', os: 'SO', date: 'Fecha',
        machineCol: 'Máquina', clean: '✕ Limpiar filtros',
        byDifficulty: 'Máquinas por dificultad:',
        empty: 'Sin máquinas para este filtro.',
        initializing: 'Inicializando…', menu: '☰ menu',
        reading: f => `Leyendo ${f}…`,
        loadErr: f => `No pude cargar «${f}»`,
        jsonErr: 'No pude cargar portfolio.json',
        servedNote: 'fetch() solo funciona sirviendo la carpeta (GitHub Pages o servidor local).',
        notTranslated: dl => `Este contenido aún no está traducido; se muestra en ${dl}.`
      },
      en: {
        profile: 'profile', machines: 'machines', machinesTitle: 'Machines',
        projects: 'Projects', certifications: 'Certifications', catalog: 'catalog',
        platform: 'Platform', difficulty: 'Difficulty', os: 'OS', date: 'Date',
        machineCol: 'Machine', clean: '✕ Clear filters',
        byDifficulty: 'Machines by difficulty:',
        empty: 'No machines for this filter.',
        initializing: 'Initializing…', menu: '☰ menu',
        reading: f => `Loading ${f}…`,
        loadErr: f => `Couldn't load "${f}"`,
        jsonErr: "Couldn't load portfolio.json",
        servedNote: 'fetch() only works when serving the folder (GitHub Pages or a local server).',
        notTranslated: dl => `This content isn't translated yet; showing ${dl}.`
      }
    };

    // nombre de cada idioma dentro de cada idioma de interfaz (para el aviso)
    const LANG_NAME = {
      eu: { eu: 'euskaraz', es: 'gaztelaniaz', en: 'ingelesez' },
      es: { eu: 'euskera', es: 'castellano', en: 'inglés' },
      en: { eu: 'Basque', es: 'Spanish', en: 'English' }
    };

    function t(key, ...args) {
      const dict = I18N[lang] || I18N[DEFAULT_LANG];
      let v = (key in dict) ? dict[key] : I18N[DEFAULT_LANG][key];
      if (v == null) v = key;
      return typeof v === 'function' ? v(...args) : v;
    }
    function tr(val) {
      if (val == null) return '';
      if (typeof val === 'string') return val;
      if (Array.isArray(val)) return val;
      return val[lang] || val[DEFAULT_LANG] || val[LANGS.find(l => val[l])] || '';
    }
    function trArr(val) {
      if (Array.isArray(val)) return val;
      if (val && typeof val === 'object') return val[lang] || val[DEFAULT_LANG] || [];
      return [];
    }
    // resuelve el .md a cargar según el idioma; si no hay traducción, cae al base
    function resolveDoc(entry) {
      const map = entry.file_i18n || {};
      if (map[lang]) return { path: map[lang], fallback: null };
      return { path: entry.file, fallback: (lang !== DEFAULT_LANG) ? DEFAULT_LANG : null };
    }

    function initLang() {
      let l = null;
      try { l = localStorage.getItem('lang'); } catch (e) {}
      if (!LANGS.includes(l)) {
        const nav0 = (navigator.language || '').slice(0, 2).toLowerCase();
        l = LANGS.includes(nav0) ? nav0 : (data.defaultLang || DEFAULT_LANG);
      }
      lang = LANGS.includes(l) ? l : DEFAULT_LANG;
    }
    function setLang(l) {
      if (!LANGS.includes(l) || l === lang) return;
      lang = l;
      try { localStorage.setItem('lang', l); } catch (e) {}
      document.documentElement.lang = l;
      updateChrome();
      buildNav();
      route();
    }
    function updateChrome() {
      brandHandle.textContent = data.profile.handle || 'portfolio';
      tagline.textContent = tr(data.profile.role) || '';
      document.getElementById('menuBtn').textContent = t('menu');
      langSwitch.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === lang));
    }

    document.getElementById('menuBtn').onclick = () => toggleMenu(true);
    backdrop.onclick = () => toggleMenu(false);
    function toggleMenu(open) { sidebar.classList.toggle('open', open); backdrop.classList.toggle('show', open); }

    init();

    async function init() {
      try {
        const res = await fetch('portfolio.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('portfolio.json no encontrado (HTTP ' + res.status + ')');
        data = await res.json();
      } catch (err) {
        content.innerHTML = '<p class="status error">' + esc(t('jsonErr')) + ' — ' + esc(err.message)
          + '</p><p class="status">' + esc(t('servedNote')) + '</p>';
        tagline.textContent = 'error'; return;
      }

      initLang();
      document.documentElement.lang = lang;

      // indexar máquinas y docs para búsquedas O(1)
      (data.machines || []).forEach(m => byFile.set(m.file, { entry: m, kind: 'machine' }));
      (data.sections || []).forEach(s => (s.docs || []).forEach(d => byFile.set(d.file, { entry: d, kind: 'doc', section: s })));

      // cablear el selector de idioma
      langSwitch.querySelectorAll('.lang-btn').forEach(b =>
        b.addEventListener('click', () => setLang(b.dataset.lang)));

      updateChrome();
      buildNav();
      route();
    }

    function buildNav() {
      // enlaces principales
      nav.innerHTML =
        '<a class="nav-link" href="#/" data-route="/"><span class="glyph">$</span> ' + esc(t('profile')) + '</a>' +
        '<a class="nav-link" href="#/machines" data-route="/machines"><span class="glyph">#</span> ' + esc(t('machines')) + ' <span style="margin-left:auto;font-size:11px;color:var(--muted)">' + (data.machines || []).length + '</span></a>';

      // secciones dinámicas (proyectos, notas...)
      (data.sections || []).forEach(section => {
        const h = document.createElement('div');
        h.className = 'section-title';
        h.textContent = tr(section.name);
        nav.appendChild(h);
        (section.docs || []).forEach(d => {
          const a = document.createElement('a');
          a.className = 'entry'; a.href = '#' + d.file; a.dataset.file = d.file;
          a.innerHTML = esc(tr(d.title)) + '<span class="entry-meta">' + esc(d.date || '') + '</span>';
          a.addEventListener('click', () => toggleMenu(false));
          nav.appendChild(a);
        });
      });

      nav.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', () => toggleMenu(false)));
    }

    window.addEventListener('hashchange', route);

    function route() {
      const hash = decodeURIComponent(location.hash.slice(1));
      // marcar activo
      nav.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.route === hash));
      nav.querySelectorAll('.entry').forEach(e => e.classList.toggle('active', e.dataset.file === hash));

      if (hash === '/machines') return renderMachines();
      if (hash && byFile.has(hash)) return renderDoc(hash);
      return renderHome();
    }

    /* ---------- PORTADA ---------- */
    function renderHome() {
      const p = data.profile;
      const machines = data.machines || [];
      const sections = data.sections || [];
      const certs = p.certs || [];

      // recuentos derivados de los datos (crecen solos al añadir cosas)
      const count = d => machines.filter(m => (m.difficulty || '').toLowerCase() === d).length;
      const projSection = sections.find(s => /proyec|proiek|project/i.test(tr(s.name)));
      const projectsCount = projSection
        ? (projSection.docs || []).length
        : sections.reduce((n, s) => n + (s.docs || []).length, 0);

      const links = (p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
      const skills = trArr(p.skills).map(s => `<span class="skill">${esc(s)}</span>`).join('');
      const certChips = certs.map(c =>
        `<span class="cert">${esc(c.name)}${c.issuer ? ` <span class="issuer">· ${esc(c.issuer)}</span>` : ''}</span>`).join('');

      // barra de estadísticas principal: se define aquí y se pinta en bucle,
      // así añadir una métrica nueva en el futuro es agregar una línea.
      const stats = [
        { n: machines.length, l: t('machines') },
        { n: projectsCount,   l: t('projects') },
        { n: certs.length,    l: t('certifications') }
      ];
      const statCells = stats.map(s => `<div class="cell"><div class="n">${s.n}</div><div class="l">${esc(s.l)}</div></div>`).join('');

      // desglose por dificultad (solo muestra los niveles que existen)
      const diffOrder = [['easy','Easy'],['medium','Medium'],['hard','Hard'],['insane','Insane']];
      const diffBreak = diffOrder.filter(([k]) => count(k) > 0)
        .map(([k,label]) => `<span class="d ${k}"><b>${count(k)}</b> ${label}</span>`).join('');

      content.innerHTML = `
        <section class="hero">
          <p class="role">${esc(tr(p.role))}</p>
          <h1>${esc(p.name || p.handle || '')}</h1>
          <p class="handle-line"><span class="at">@</span>${esc(p.handle || '')}${p.location ? `<span class="dot">·</span>${esc(p.location)}` : ''}</p>
          <p class="pitch">${esc(tr(p.pitch))}</p>
          <div class="links">${links}</div>
          ${certChips ? `<div class="certs"><span class="clabel">${esc(t('certifications'))}</span>${certChips}</div>` : ''}
          <div class="skills">${skills}</div>
          <div class="statbar">${statCells}</div>
          ${diffBreak ? `<div class="diffbar"><span style="color:var(--muted);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;align-self:center">${esc(t('byDifficulty'))}</span>${diffBreak}</div>` : ''}
        </section>`;
      document.title = (p.name || p.handle || 'portfolio');
      window.scrollTo(0, 0);
    }

    /* ---------- CATÁLOGO DE MÁQUINAS ---------- */
    function renderMachines() {
      const machines = data.machines || [];
      const platforms = [...new Set(machines.map(m => m.platform).filter(Boolean))];
      const diffs = ['Easy', 'Medium', 'Hard', 'Insane'].filter(d => machines.some(m => (m.difficulty || '') === d));

      const chip = (label, group, val) => {
        // los chips de dificultad llevan un punto del color correspondiente
        const diffCls = group === 'difficulty' ? ' chip-diff ' + val.toLowerCase() : '';
        return `<button class="chip${diffCls} ${filters[group] === val ? 'active' : ''}" data-group="${group}" data-val="${esc(val)}">${esc(label)}</button>`;
      };

      const platChips = platforms.map(pl => chip(pl, 'platform', pl)).join('');
      const diffChips = diffs.map(d => chip(d, 'difficulty', d)).join('');

      const rows = machines.filter(m =>
        (!filters.platform || m.platform === filters.platform) &&
        (!filters.difficulty || m.difficulty === filters.difficulty)
      );

      const body = rows.length ? rows.map(m => {
        const dcls = (m.difficulty || '').toLowerCase();
        const tags = (m.tags || []).map(tag => `<span class="minitag">${esc(tag)}</span>`).join('');
        return `
          <tr class="row" data-file="${esc(m.file)}">
            <td class="td-name" data-label="${esc(t('machineCol'))}">
              <span class="m-name">${esc(m.title)}</span>
              <div class="m-tags">${tags}</div>
            </td>
            <td data-label="${esc(t('platform'))}"><span class="badge plat">${esc(m.platform || '—')}</span></td>
            <td data-label="${esc(t('difficulty'))}"><span class="diff ${dcls}">${esc(m.difficulty || '—')}</span></td>
            <td data-label="${esc(t('os'))}"><span class="badge os">${esc(m.os || '—')}</span></td>
            <td data-label="${esc(t('date'))}" style="font-family:var(--mono);color:var(--muted);font-size:12px">${esc(m.date || '')}</td>
          </tr>`;
      }).join('') : '';

      content.innerHTML = `
        <div class="view-head">
          <p class="kicker">${esc(t('catalog'))}</p>
          <h2>${esc(t('machinesTitle'))}</h2>
        </div>
        <div class="filters">
          <div class="filter-row">
            <span class="filter-label">${esc(t('platform'))}</span>
            <div class="chip-set">${platChips}</div>
          </div>
          <div class="filter-row">
            <span class="filter-label">${esc(t('difficulty'))}</span>
            <div class="chip-set">${diffChips}</div>
          </div>
          ${(filters.platform || filters.difficulty)
            ? '<button class="chip chip-reset" data-group="reset" data-val="">' + esc(t('clean')) + '</button>'
            : ''}
        </div>
        <table class="machines-table">
          <thead><tr><th>${esc(t('machineCol'))}</th><th>${esc(t('platform'))}</th><th>${esc(t('difficulty'))}</th><th>${esc(t('os'))}</th><th>${esc(t('date'))}</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
        ${rows.length ? '' : '<p class="empty">' + esc(t('empty')) + '</p>'}`;

      // eventos de filtros
      content.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        const g = c.dataset.group, v = c.dataset.val;
        if (g === 'reset') { filters.platform = null; filters.difficulty = null; }
        else { filters[g] = filters[g] === v ? null : v; }
        renderMachines();
      }));
      // click en fila -> writeup
      content.querySelectorAll('tr.row').forEach(r =>
        r.addEventListener('click', () => { location.hash = '#' + r.dataset.file; }));

      document.title = t('machinesTitle') + ' · @' + data.profile.handle;
      window.scrollTo(0, 0);
    }

    /* ---------- DOC / WRITEUP ---------- */
    async function renderDoc(file) {
      const { entry, kind, section } = byFile.get(file);
      const { path, fallback } = resolveDoc(entry);
      content.innerHTML = '<p class="status">' + esc(t('reading', path)) + '</p>';
      try {
        const res = await fetch(path, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        const html = DOMPurify.sanitize(marked.parse(md));

        // aviso si se muestra un idioma distinto al activo
        const banner = fallback
          ? `<div class="doc-banner">${esc(t('notTranslated', LANG_NAME[lang][fallback]))}</div>`
          : '';

        let crumb, badges = '';
        if (kind === 'machine') {
          crumb = esc(t('machines')) + ' <span class="sep">/</span> ' + esc(entry.platform || '');
          const dcls = (entry.difficulty || '').toLowerCase();
          badges = `<div class="doc-badges">
            <span class="badge plat">${esc(entry.platform || '')}</span>
            <span class="diff ${dcls}">${esc(entry.difficulty || '')}</span>
            <span class="badge os">${esc(entry.os || '')}</span>
            ${(entry.tags || []).map(tag => `<span class="minitag">${esc(tag)}</span>`).join('')}
          </div>`;
        } else {
          crumb = esc(tr(section.name));
          badges = (entry.tags || []).length ? `<div class="doc-badges">${(entry.tags || []).map(tag => `<span class="minitag">${esc(tag)}</span>`).join('')}</div>` : '';
        }

        content.innerHTML = `
          <div class="doc-header">
            <div class="crumb">${crumb}</div>
            <h1>${esc(tr(entry.title))}</h1>
            ${badges}
          </div>
          ${banner}
          <article class="markdown">${html}</article>`;

        content.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        document.title = tr(entry.title) + ' · @' + data.profile.handle;
        window.scrollTo(0, 0);
      } catch (err) {
        content.innerHTML = '<p class="status error">' + esc(t('loadErr', path)) + ' — ' + esc(err.message) + '</p>';
      }
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  </script>
</body>
</html>
