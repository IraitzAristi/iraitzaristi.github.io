<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>~/writeups</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tema de resaltado de código (lo ajustamos después con CSS propio) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />

  <style>
    /* ============================================================
       TOKENS  ·  paleta "dossier de terminal": tinta profunda,
       ámbar de CRT como único acento, tipografía mono para el
       chrome del sistema y proporcional para la prosa del writeup.
       ============================================================ */
    :root {
      --bg:        #0b0e13;   /* tinta casi negra, ligeramente azulada */
      --surface:   #12171f;   /* paneles y bloques de código          */
      --surface-2: #171d27;   /* hover / elementos activos            */
      --border:    #232c38;   /* líneas de rejilla del dossier        */
      --text:      #c9d1dc;   /* cuerpo, blanco roto legible          */
      --muted:     #6b7684;   /* metadatos, timestamps                */
      --accent:    #f2b705;   /* ámbar CRT: el único color vivo        */
      --accent-dim:#7a5f10;   /* ámbar apagado para bordes/estados    */
      --danger:    #e5484d;   /* severidad alta / labels críticos     */

      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;

      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ============================================================
       LAYOUT: barra lateral fija + panel de contenido
       ============================================================ */
    .layout { display: flex; min-height: 100vh; }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
    }
    .brand .prompt {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .brand .prompt .sigil { color: var(--accent); }
    .brand .cursor {
      display: inline-block;
      width: 8px; height: 1.05em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .brand .tagline {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* Navegación por secciones */
    nav { padding: 8px 0 40px; }

    .section-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      padding: 18px 20px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: "";
      width: 6px; height: 6px;
      background: var(--accent-dim);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .entry {
      display: block;
      padding: 9px 20px 9px 34px;
      font-size: 14px;
      color: var(--text);
      border-left: 2px solid transparent;
      position: relative;
    }
    .entry:hover { background: var(--surface-2); text-decoration: none; }
    .entry.active {
      background: var(--surface-2);
      border-left-color: var(--accent);
      color: var(--accent);
    }
    .entry .entry-meta {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ---------- CONTENIDO ---------- */
    .content {
      flex: 1;
      min-width: 0;               /* evita desbordes de <pre> */
      padding: 56px clamp(24px, 6vw, 96px) 120px;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Panel de inicio */
    .home .kicker {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .home h1 {
      font-family: var(--mono);
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin: 12px 0 18px;
      color: var(--text);
    }
    .home .lede { font-size: 18px; color: var(--muted); max-width: 60ch; }
    .home .stats {
      display: flex;
      gap: 40px;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
    }
    .home .stat .n { font-size: 30px; font-weight: 700; color: var(--accent); }
    .home .stat .l { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

    /* ============================================================
       MARKDOWN RENDERIZADO
       ============================================================ */
    .doc-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .doc-header .crumb {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .doc-header .crumb .sep { color: var(--accent-dim); margin: 0 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.03em;
    }
    .tag.sev-high { border-color: var(--danger); color: var(--danger); }
    .tag.sev-medium { border-color: var(--accent-dim); color: var(--accent); }

    .markdown { font-size: 16px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      font-family: var(--mono);
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 2em 0 0.6em;
    }
    .markdown h1 { font-size: 28px; }
    .markdown h2 {
      font-size: 22px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .markdown h3 { font-size: 18px; color: var(--accent); }
    .markdown p { margin: 1em 0; }
    .markdown ul, .markdown ol { padding-left: 1.4em; }
    .markdown li { margin: 0.35em 0; }
    .markdown img { max-width: 100%; border: 1px solid var(--border); }
    .markdown blockquote {
      margin: 1.4em 0;
      padding: 4px 18px;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      color: var(--muted);
    }
    .markdown hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }

    /* Código en línea */
    .markdown code {
      font-family: var(--mono);
      font-size: 0.88em;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      color: var(--accent);
    }
    /* Bloques de código */
    .markdown pre {
      background: var(--surface) !important;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0;
      overflow: hidden;
      margin: 1.5em 0;
    }
    .markdown pre code {
      display: block;
      background: transparent !important;
      border: none;
      padding: 18px 20px;
      overflow-x: auto;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.6;
      border-radius: 0;
    }

    /* Tablas */
    .markdown table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5em 0;
      font-size: 14px;
    }
    .markdown th, .markdown td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown th {
      background: var(--surface);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Estados */
    .status { font-family: var(--mono); color: var(--muted); font-size: 14px; }
    .status.error { color: var(--danger); }

    /* ============================================================
       RESPONSIVE: la barra lateral se convierte en menú desplegable
       ============================================================ */
    .menu-btn {
      display: none;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 30;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 15;
    }

    @media (max-width: 820px) {
      .menu-btn { display: block; }
      .sidebar {
        position: fixed;
        z-index: 20;
        left: 0; top: 0;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop.show { display: block; }
      .content { padding-top: 68px; }
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir el índice">☰ index</button>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <!-- BARRA LATERAL: se rellena desde writeups.json -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="prompt"><span class="sigil">~/</span>writeups<span class="cursor"></span></div>
        <div class="tagline" id="tagline">cargando índice…</div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <!-- CONTENIDO: inicio o writeup renderizado -->
    <main class="content" id="content">
      <p class="status">Inicializando…</p>
    </main>
  </div>

  <!-- Librerías (se cargan desde CDN al abrir la página) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
  /* ================================================================
     LÓGICA DEL SITIO
     - Lee writeups.json (tu índice, editado a mano).
     - Construye la navegación agrupada por secciones.
     - Enrutado por hash: #<ruta-del-md> hace un writeup enlazable.
     ================================================================ */

  const nav      = document.getElementById('nav');
  const content  = document.getElementById('content');
  const tagline  = document.getElementById('tagline');
  const sidebar  = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');

  let manifest = null;          // contenido de writeups.json
  const byFile = new Map();     // ruta .md -> {entry, section} para búsquedas rápidas

  // --- Menú móvil ---
  function toggleMenu(open) {
    sidebar.classList.toggle('open', open);
    backdrop.classList.toggle('show', open);
  }
  document.getElementById('menuBtn').onclick = () => toggleMenu(true);
  backdrop.onclick = () => toggleMenu(false);

  // --- Arranque ---
  init();

  async function init() {
    try {
      const res = await fetch('writeups.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('writeups.json no encontrado (HTTP ' + res.status + ')');
      manifest = await res.json();
    } catch (err) {
      content.innerHTML = '<p class="status error">No pude cargar writeups.json — '
        + escapeHtml(err.message) + '</p><p class="status">Recuerda que fetch() solo '
        + 'funciona sirviendo la carpeta (GitHub Pages o un servidor local), no abriendo '
        + 'el archivo con doble clic.</p>';
      tagline.textContent = 'error';
      return;
    }

    tagline.textContent = manifest.tagline || 'notas de campo';
    buildNav();
    route();                    // pinta la vista según el hash actual
  }

  // --- Construye la barra lateral desde el manifiesto ---
  function buildNav() {
    let total = 0;
    manifest.sections.forEach(section => {
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = section.name;
      nav.appendChild(h);

      section.writeups.forEach(w => {
        total++;
        byFile.set(w.file, { entry: w, section });
        const a = document.createElement('a');
        a.className = 'entry';
        a.href = '#' + w.file;
        a.dataset.file = w.file;
        a.innerHTML = escapeHtml(w.title)
          + '<span class="entry-meta">' + escapeHtml(w.date || '') + '</span>';
        a.addEventListener('click', () => toggleMenu(false));
        nav.appendChild(a);
      });
    });
    manifest._total = total;
  }

  // --- Enrutado ---
  window.addEventListener('hashchange', route);

  function route() {
    const file = decodeURIComponent(location.hash.slice(1));
    // marca la entrada activa
    document.querySelectorAll('.entry').forEach(e =>
      e.classList.toggle('active', e.dataset.file === file));

    if (file && byFile.has(file)) {
      loadWriteup(file);
    } else {
      renderHome();
    }
  }

  // --- Vista de inicio ---
  function renderHome() {
    content.innerHTML = `
      <div class="home">
        <p class="kicker">${escapeHtml(manifest.kicker || 'field notes')}</p>
        <h1>${escapeHtml(manifest.title || 'Writeups')}</h1>
        <p class="lede">${escapeHtml(manifest.intro || '')}</p>
        <div class="stats">
          <div class="stat"><div class="n">${manifest._total}</div><div class="l">WRITEUPS</div></div>
          <div class="stat"><div class="n">${manifest.sections.length}</div><div class="l">SECCIONES</div></div>
        </div>
      </div>`;
    document.title = '~/writeups';
    content.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  // --- Carga y renderiza un .md ---
  async function loadWriteup(file) {
    const { entry, section } = byFile.get(file);
    content.innerHTML = '<p class="status">Leyendo ' + escapeHtml(file) + ' …</p>';
    try {
      const res = await fetch(file, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();

      const rawHtml = marked.parse(md);
      const clean = DOMPurify.sanitize(rawHtml);

      const tags = (entry.tags || []).map(t => {
        let cls = 'tag';
        if (/high|alta|crit/i.test(t)) cls += ' sev-high';
        else if (/med/i.test(t)) cls += ' sev-medium';
        return `<span class="${cls}">${escapeHtml(t)}</span>`;
      }).join('');

      content.innerHTML = `
        <div class="doc-header">
          <div class="crumb">${escapeHtml(section.name)}<span class="sep">/</span>${escapeHtml(entry.title)}</div>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
        </div>
        <article class="markdown">${clean}</article>`;

      // resalta cada bloque de código
      content.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

      document.title = entry.title + ' · ~/writeups';
      window.scrollTo(0, 0);
    } catch (err) {
      content.innerHTML = '<p class="status error">No pude cargar «' + escapeHtml(file)
        + '» — ' + escapeHtml(err.message) + '</p>';
    }
  }

  // --- utilidad ---
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  </script>
</body>
</html>
