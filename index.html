<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>~/IraitzAristi</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" integrity="sha384-6PRNB60loRkq5oYgj0ETV33K0YsTUlab8qtfTGXhRgW5Nz1IpzS2zwj6UmlJEnyV" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* ============================================================
       TOKENS · "dossier de terminal": tinta profunda, ámbar CRT
       como color de marca, y colores de dificultad reservados
       SOLO para los badges (el resto de la página se mantiene sobrio).
       ============================================================ */
    :root {
      --bg:        #0b0e13;
      --surface:   #12171f;
      --surface-2: #171d27;
      --border:    #232c38;
      --text:      #c9d1dc;
      --muted:     #6b7684;
      --accent:    #f2b705;   /* ámbar CRT = marca */
      --accent-dim:#7a5f10;

      /* Dificultad (convención tipo HTB) */
      --easy:   #56d364;
      --medium: #f2b705;
      --hard:   #e5484d;
      --insane: #c264e5;

      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    .layout { display: flex; min-height: 100vh; }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
    .brand .prompt { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .brand .prompt .sigil { color: var(--accent); }
    .brand .cursor {
      display: inline-block; width: 8px; height: 1.05em; background: var(--accent);
      margin-left: 2px; vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .brand .tagline { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    /* Selector de idioma: control segmentado grande con banderas */
    .lang-switch { display: flex; margin-top: 14px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .lang-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
      padding: 9px 6px; background: transparent; border: none; color: var(--muted); cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .lang-btn + .lang-btn { border-left: 1px solid var(--border); }
    .lang-btn:hover { color: var(--text); background: var(--surface-2); }
    .lang-btn .flag { width: 22px; height: 15px; border-radius: 2px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset; display: block; }
    .lang-btn.active { background: var(--surface-2); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
    /* Aviso cuando un writeup aún no está traducido */
    .doc-banner { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px dashed var(--accent-dim); padding: 8px 12px; margin-bottom: 24px; }

    nav { padding: 8px 0 40px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-family: var(--mono); font-size: 13.5px;
      color: var(--text); border-left: 2px solid transparent;
    }
    .nav-link:hover { background: var(--surface-2); text-decoration: none; }
    .nav-link.active { background: var(--surface-2); border-left-color: var(--accent); color: var(--accent); }
    .nav-link .glyph { color: var(--accent-dim); }
    .nav-link.active .glyph { color: var(--accent); }

    .section-title {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
      padding: 20px 20px 8px; display: flex; align-items: center; gap: 8px;
    }
    .section-title::before { content: ""; width: 6px; height: 6px; background: var(--accent-dim); transform: rotate(45deg); }
    .entry { display: block; padding: 8px 20px 8px 34px; font-size: 13.5px; color: var(--text); border-left: 2px solid transparent; }
    .entry:hover { background: var(--surface-2); text-decoration: none; }
    .entry.active { background: var(--surface-2); border-left-color: var(--accent); color: var(--accent); }
    .entry .entry-meta { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

    /* ---------- CONTENIDO ---------- */
    .content { flex: 1; min-width: 0; padding: 64px 0; max-width: 2200px; width: 100%; display: flex; flex-direction: column; }
    /* Home: hero desplazado a la derecha, aside pegado a la derecha (asimétrico) */
    .content.is-home { --pl-home: clamp(32px, 9vw, 240px); --pr-home: clamp(24px, 3vw, 56px); padding-left: var(--pl-home); padding-right: var(--pr-home); justify-content: safe center; }
    /* Writeups / proyectos / catálogo: mismos márgenes izquierda y derecha (simétrico) */
    .content.is-doc, .content.is-list { padding-left: clamp(32px, 9vw, 240px); padding-right: clamp(32px, 9vw, 240px); }

    /* ---------- PERFIL EN DOS COLUMNAS ---------- */
    .profile-grid { display: grid; grid-template-columns: minmax(0, 860px) minmax(400px, 540px); gap: clamp(64px, 8vw, 200px); align-items: start; }
    .profile-aside .featured { margin-top: 0; }
    .profile-aside .latest { margin-top: 96px; }
    @media (max-width: 1450px) {
      .profile-grid { grid-template-columns: 1fr; }
      .profile-aside { margin-top: 4px; }
    }

    /* ---------- FEATURED / NOVEDADES ---------- */
    .featured { margin-top: 60px; }
    .feat-head { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .feat-head::before { content: ""; width: 6px; height: 6px; background: var(--accent-dim); transform: rotate(45deg); }
    .feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .feat-card { display: flex; flex-direction: column; gap: 9px; background: var(--bg); padding: 20px; min-height: 118px; }
    .feat-card:hover { background: var(--surface); text-decoration: none; }
    .feat-kind { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-dim); }
    .feat-card:hover .feat-kind { color: var(--accent); }
    .feat-title { font-family: var(--mono); font-size: 15px; color: var(--text); line-height: 1.3; }
    .feat-card:hover .feat-title { color: var(--accent); }
    .feat-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: auto; }

    /* ---------- NOVEDADES / LATEST (log cronológico) ---------- */
    .latest { margin-top: 48px; }
    .latest-list { border: 1px solid var(--border); }
    .latest-row { display: flex; align-items: baseline; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 13px; }
    .latest-row:last-child { border-bottom: none; }
    .latest-row:hover { background: var(--surface); text-decoration: none; }
    .latest-date { color: var(--accent-dim); font-size: 12px; flex-shrink: 0; width: 78px; }
    .latest-title { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .latest-row:hover .latest-title { color: var(--accent); }
    .latest-kind { margin-left: auto; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; flex-shrink: 0; }

    /* ===== PORTADA / PERFIL ===== */
    .hero .role {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--accent);
    }
    .hero h1 {
      font-family: var(--mono); font-size: clamp(34px, 6vw, 58px); line-height: 1.02;
      letter-spacing: -0.03em; margin: 10px 0 12px;
    }
    .hero .handle-line { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0 0 20px; }
    .hero .handle-line .at { color: var(--accent-dim); }
    .hero .handle-line .dot { margin: 0 8px; color: var(--accent-dim); }
    .hero .pitch { font-size: 18px; color: var(--muted); max-width: 62ch; line-height: 1.7; }
    .hero .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; }
    .hero .links a {
      font-family: var(--mono); font-size: 13px; padding: 7px 14px;
      border: 1px solid var(--border); color: var(--text);
    }
    .hero .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    /* Certificaciones: destacadas con borde ámbar */
    .certs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 40px; }
    .certs .clabel { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-right: 4px; }

    /* ---------- SECURITY RESEARCH / FINDINGS ---------- */
    .findings { margin-top: 34px; }
    .findings .clabel { display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 12px; }
    .finding-list { display: flex; flex-direction: column; gap: 10px; }
    .finding { display: block; border: 1px solid var(--border); border-left: 2px solid var(--accent); padding: 12px 16px; background: var(--surface); }
    .finding:hover { background: var(--surface-2); text-decoration: none; }
    .finding-title { display: block; font-family: var(--mono); font-size: 14px; color: var(--accent); }
    .finding-meta { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    .cert { font-family: var(--mono); font-size: 12px; padding: 4px 11px; border: 1px solid var(--accent-dim); color: var(--accent); background: var(--surface); }
    .cert .issuer { color: var(--muted); }

    .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 46px; }
    .skill {
      font-family: var(--mono); font-size: 12px; padding: 4px 11px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    }

    /* Estadísticas principales (se calculan solas desde los datos) */
    .stats-block { margin: 76px calc(-1 * var(--pr-home, 56px)) 0 calc(-1 * var(--pl-home, 240px)); }
    .stats-block .statbar { max-width: 1080px; margin-left: auto; margin-right: auto; }
    .statbar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1px; margin-top: 0; background: var(--border);
      border: 1px solid var(--border);
    }
    .statbar .cell { background: var(--bg); padding: 34px 20px; text-align: center; }
    .statbar .n { font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--accent); line-height: 1; }
    .statbar .l { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-top: 12px; text-transform: uppercase; }

    /* Desglose por dificultad (fila secundaria, con puntos de color) */
    .diffbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 22px; font-family: var(--mono); font-size: 13px; }
    .diffbar .d { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
    .diffbar .d::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
    .diffbar .d.easy { --dot: var(--easy); } .diffbar .d.medium { --dot: var(--medium); }
    .diffbar .d.hard { --dot: var(--hard); } .diffbar .d.insane { --dot: var(--insane); }
    .diffbar .d b { color: var(--text); font-weight: 700; }

    /* ===== CATÁLOGO DE MÁQUINAS ===== */
    .view-head { margin-bottom: 28px; }
    .view-head .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    .view-head h2 { font-family: var(--mono); font-size: 30px; letter-spacing: -0.02em; margin: 8px 0 0; }

    /* Filtros agrupados por criterio */
    .filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
    .filter-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .filter-label {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--muted);
      width: 92px; flex-shrink: 0; text-align: right;
    }
    .chip-set { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: var(--mono); font-size: 12px; padding: 6px 12px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    }
    .chip:hover { color: var(--text); }
    .chip.active { border-color: var(--accent); color: var(--accent); background: var(--surface-2); }
    /* Punto de color por dificultad (solo el punto, el texto no cambia) */
    .chip-diff { display: inline-flex; align-items: center; gap: 7px; }
    .chip-diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex-shrink: 0; }
    .chip-diff.easy   { --dot: var(--easy); }
    .chip-diff.medium { --dot: var(--medium); }
    .chip-diff.hard   { --dot: var(--hard); }
    .chip-diff.insane { --dot: var(--insane); }
    /* Botón de limpiar (aparece solo con filtros activos) */
    .chip-reset { align-self: flex-start; border-style: dashed; }
    .chip-reset:hover { color: var(--hard); border-color: var(--hard); }

    @media (max-width: 860px) {
      .filter-label { width: auto; text-align: left; }
    }

    /* Tabla (desktop) */
    .machines-table { width: 100%; border-collapse: collapse; }
    .machines-table th {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .machines-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }
    .machines-table tr.row { cursor: pointer; }
    .machines-table tr.row:hover td { background: var(--surface); }
    .machines-table .m-name { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .machines-table tr.row:hover .m-name { color: var(--accent); }
    .machines-table .m-tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }

    .badge { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); white-space: nowrap; display: inline-block; }
    .badge.plat { color: var(--muted); }
    .badge.os { color: var(--muted); }
    .diff { font-family: var(--mono); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
    .diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .diff.easy { color: var(--easy); } .diff.medium { color: var(--medium); }
    .diff.hard { color: var(--hard); } .diff.insane { color: var(--insane); }
    .minitag { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }

    .empty { font-family: var(--mono); color: var(--muted); padding: 40px 0; text-align: center; }

    /* ===== WRITEUP RENDERIZADO ===== */
    .doc-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .doc-header .crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    .doc-header .crumb .sep { color: var(--accent-dim); margin: 0 6px; }
    .doc-header h1 { font-family: var(--mono); font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; margin: 14px 0 0; }
    .doc-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }

    .markdown { font-size: 15px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { font-family: var(--mono); letter-spacing: -0.02em; line-height: 1.25; margin: 2em 0 0.6em; }
    .markdown h1 { font-size: 26px; } .markdown h2 { font-size: 21px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .markdown h3 { font-size: 18px; color: var(--accent); }
    .markdown p { margin: 1em 0; }
    .markdown ul, .markdown ol { padding-left: 1.4em; } .markdown li { margin: 0.35em 0; }
    .markdown img { max-width: 100%; border: 1px solid var(--border); }
    .markdown blockquote { margin: 1.4em 0; padding: 4px 18px; border-left: 3px solid var(--accent); background: var(--surface); color: var(--muted); }
    .markdown hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }
    .markdown code { font-family: var(--mono); font-size: 0.88em; background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; color: var(--accent); }
    .markdown pre { background: var(--surface) !important; border: 1px solid var(--border); border-radius: 6px; padding: 0; overflow: hidden; margin: 1.5em 0; }
    .markdown pre code { display: block; background: transparent !important; border: none; padding: 18px 20px; overflow-x: auto; color: var(--text); font-size: 13.5px; line-height: 1.6; border-radius: 0; }
    .markdown table { border-collapse: collapse; width: 100%; margin: 1.5em 0; font-size: 14px; }
    .markdown th, .markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .markdown th { background: var(--surface); font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

    .status { font-family: var(--mono); color: var(--muted); font-size: 14px; }
    .status.error { color: var(--hard); }

    /* ---------- RESPONSIVE ---------- */
    .menu-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 30; background: var(--surface); border: 1px solid var(--border); color: var(--accent); font-family: var(--mono); font-size: 13px; padding: 8px 12px; cursor: pointer; }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 15; }

    @media (max-width: 860px) {
      .menu-btn { display: block; }
      .sidebar { position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.22s ease; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
      .sidebar.open { transform: translateX(0); }
      .backdrop.show { display: block; }
      .content { padding-top: 68px; }

      /* La tabla de máquinas pasa a tarjetas */
      .machines-table, .machines-table tbody, .machines-table tr, .machines-table td { display: block; width: 100%; }
      .machines-table thead { display: none; }
      .machines-table tr.row { border: 1px solid var(--border); margin-bottom: 12px; padding: 4px 0; }
      .machines-table tr.row:hover td { background: transparent; }
      .machines-table td { border: none; padding: 6px 16px; }
      .machines-table td::before { content: attr(data-label); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 3px; }
      .machines-table td.td-name::before { display: none; }
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir el menú">☰ menu</button>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="prompt"><span class="sigil">~/</span><span id="brandHandle">IraitzAristi</span><span class="cursor"></span></div>
        <div class="tagline" id="tagline">loading…</div>
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="eu" aria-label="Euskara">
            <svg class="flag" viewBox="0 0 30 20" aria-hidden="true">
              <rect width="30" height="20" fill="#d52b1e"/>
              <g stroke="#009b48" stroke-width="4"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g>
              <g stroke="#fff" stroke-width="4"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g>
            </svg><span>EU</span>
          </button>
          <button class="lang-btn" data-lang="es" aria-label="Castellano">
            <svg class="flag" viewBox="0 0 30 20" aria-hidden="true">
              <rect width="30" height="20" fill="#c60b1e"/>
              <rect y="5" width="30" height="10" fill="#ffc400"/>
            </svg><span>ES</span>
          </button>
          <button class="lang-btn" data-lang="en" aria-label="English">
